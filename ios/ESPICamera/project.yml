# XcodeGen spec for the ESPI Camera iOS app. Generate the Xcode project with
#   xcodegen generate        (run in this folder; the .xcodeproj is git-ignored)
# The signing team is passed on the xcodebuild command line (see testflight.sh),
# so no team ID is stored in this public repository.
name: ESPICamera
options:
  bundleIdPrefix: com.alexworland
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
targets:
  ESPICamera:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: ESPI Camera
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: >-
          ESPI Camera sends the camera image to the ESPI Live viewer on the
          computer this iPhone is plugged into.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        LSApplicationCategoryType: public.app-category.utilities
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexworland.espicamera
        PRODUCT_NAME: ESPICamera
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  ESPICameraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ESPICamera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexworland.espicamera.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ESPICamera.app/ESPICamera
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  ESPICamera:
    build:
      targets:
        ESPICamera: all
        ESPICameraTests: [test]
    test:
      targets:
        - ESPICameraTests
    archive:
      config: Release
