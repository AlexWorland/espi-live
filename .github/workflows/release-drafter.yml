name: Release drafter

# Keeps one draft release up to date: after every merge into main it lists the
# merged pull requests and proposes the next version tag (config:
# .github/release-drafter.yml). The draft is not public and builds nothing.
# Publishing it (Releases > the draft > Edit > Publish release) creates the
# tag on main and starts "Build release" (build-binaries.yml), which tests,
# builds and attaches the binaries.
#
# The notes are rewritten on every merge, so edits made to the draft by hand
# are lost until you publish; change a pull request's title or labels instead.
# "Run workflow" regenerates the draft without a merge.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-drafter
  cancel-in-progress: false

jobs:
  update_release_draft:
    name: Update draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create and update the draft release
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
