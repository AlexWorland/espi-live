name: Release drafter

# Regenerates the draft release, which lists the pull requests merged since
# the last release and proposes the next version tag from their labels
# (config: .github/release-drafter.yml). The draft is not public and builds
# nothing.
#
# After every merge into main, "Release" (build-binaries.yml) rewrites the
# draft itself, in its "version" job, and releases the version it proposes;
# a run here at the same time could race with it, so this workflow no longer
# runs on merges. "Release" starts it after each full release, so the draft
# moves on to the next version, and "Run workflow" regenerates the draft by
# hand. Publishing the draft by hand (Releases > the draft > Edit > Publish
# release) still starts "Release" for that tag.
#
# The notes are rewritten every time, so edits made to the draft by hand are
# lost; change a pull request's title or labels instead.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-drafter
  cancel-in-progress: false

jobs:
  update_release_draft:
    name: Update draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create and update the draft release
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          config-name: release-drafter.yml
