name: Build binaries

# Builds self-contained PyInstaller binaries for Windows, Linux and macOS when a
# pull request is merged into main, uploads them as workflow artifacts, and
# refreshes a rolling "latest" pre-release. Run it by hand from the Actions tab
# to build the current head of any branch (workflow_dispatch).
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize runs so two quick merges cannot race on the rolling release.
concurrency:
  group: build-binaries
  cancel-in-progress: false

env:
  # PRs: build the merge commit (not the PR head). Manual runs: the dispatched ref.
  BUILD_REF: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

jobs:
  build:
    # Closed-without-merging PRs also fire this event; skip them.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows matches the camera PC: Python 3.10 + the SDK 4.2 PySpin wheel.
          # numpy is unpinned because requirements.txt pins versions that need Python >= 3.11.
          - name: windows-x64
            os: windows-latest
            python: "3.10"
            pip_deps: numpy opencv-python pillow PySide6 certifi pyinstaller
            asset: espi-live-windows-x64.zip
            lfs_include: third_party/flir-spinnaker-4.2/python-wheel/spinnaker_python-4.2.0.88-cp310-cp310-win_amd64.whl
          # Linux: ubuntu-24.04 is "noble", the distro the Spinnaker 4.4 packages target.
          - name: linux-x64
            os: ubuntu-24.04
            python: "3.12"
            pip_deps: -r requirements.txt certifi pyinstaller
            asset: espi-live-linux-x64.tar.gz
            lfs_include: third_party/spinnaker-4.4/spinnaker_python-4.4.0.246-cp312-cp312-linux_x86_64.tar.gz,third_party/spinnaker-4.4/spinnaker-4.4.0.246-noble-amd64-pkg.tar.gz
          # macOS has no PySpin wheel, so this build runs --demo only.
          - name: macos-arm64
            os: macos-latest
            python: "3.12"
            pip_deps: -r requirements.txt certifi pyinstaller
            asset: espi-live-macos-arm64.zip
            lfs_include: ""

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
          lfs: false # fetch only the SDK files this platform needs, below

      # Git LFS bandwidth is metered (1 GB/month on the free plan), so cache the
      # LFS objects keyed by their content hashes: unchanged SDK files are never
      # re-downloaded.
      - name: Compute LFS cache key
        if: matrix.lfs_include != ''
        id: lfs
        shell: bash
        env:
          LFS_INCLUDE: ${{ matrix.lfs_include }}
        run: |
          key=$(git lfs ls-files --long --include="$LFS_INCLUDE" | awk '{print $1}' | sort | sha256sum | cut -c1-16)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore LFS cache
        if: matrix.lfs_include != ''
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ matrix.name }}-${{ steps.lfs.outputs.key }}

      - name: Fetch SDK files (Git LFS)
        if: matrix.lfs_include != ''
        shell: bash
        env:
          LFS_INCLUDE: ${{ matrix.lfs_include }}
        run: git lfs pull --include="$LFS_INCLUDE"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # libgl1: OpenCV; libtk8.6/libtcl8.6: Tk for the toolchain Python;
          # libegl1/libxkbcommon*/libfontconfig1/libdbus-1-3: Qt (PySide6) runtime.
          sudo apt-get update
          sudo apt-get install -y libgl1 libtk8.6 libtcl8.6 libegl1 libxkbcommon0 \
            libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
          # Spinnaker runtime libraries that PySpin links against; apt resolves their dependencies.
          mkdir -p "$RUNNER_TEMP/spinnaker"
          tar xzf third_party/spinnaker-4.4/spinnaker-4.4.0.246-noble-amd64-pkg.tar.gz \
            -C "$RUNNER_TEMP/spinnaker" --strip-components=1
          cd "$RUNNER_TEMP/spinnaker"
          sudo apt-get install -y ./libgentl_*.deb ./libspinnaker_*.deb ./libspinvideo_*.deb \
            ./libspinnaker-c_*.deb ./libspinvideo-c_*.deb
          sudo ldconfig

      - name: Install Python dependencies
        shell: bash
        run: python -m pip install --upgrade pip && python -m pip install ${{ matrix.pip_deps }}

      - name: Install PySpin (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: python -m pip install third_party/flir-spinnaker-4.2/python-wheel/spinnaker_python-4.2.0.88-cp310-cp310-win_amd64.whl

      - name: Install PySpin (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pyspin"
          tar xzf third_party/spinnaker-4.4/spinnaker_python-4.4.0.246-cp312-cp312-linux_x86_64.tar.gz \
            -C "$RUNNER_TEMP/pyspin" --wildcards '*.whl'
          python -m pip install "$RUNNER_TEMP"/pyspin/*.whl

      # Fail here, not in the field, if the SDK did not install correctly.
      - name: Check PySpin imports
        if: matrix.lfs_include != ''
        shell: bash
        run: python -c "import PySpin; print('PySpin loaded from', PySpin.__file__)"

      # Build facts the updater compares against build-info.json in the release.
      # The run number only increases, so it orders builds. UPDATE_TOKEN is a
      # fine-grained read-only token (Contents: read on this repository) that
      # lets installed copies read releases of this private repository; without
      # the secret, updates work only if the repository is public.
      - name: Write build info
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          COMMIT: ${{ env.BUILD_REF }}
          REPO: ${{ github.repository }}
          ASSET: ${{ matrix.asset }}
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          values = {"BUILD": int(os.environ["BUILD_NUMBER"])}
          for name in ("COMMIT", "REPO", "ASSET"):
              values[name] = os.environ[name]
          values["TOKEN"] = os.environ.get("UPDATE_TOKEN", "")
          with open("src/espi_live/_build_info.py", "w", encoding="utf-8") as out:
              out.write('"""Generated by CI; read by updater.py."""\n')
              for name, value in values.items():
                  out.write(f"{name} = {value!r}\n")
          print("Build", values["BUILD"], values["ASSET"],
                "with update token" if values["TOKEN"] else "WITHOUT update token")
          EOF

      - name: Build with PyInstaller
        shell: bash
        run: |
          args=(--noconfirm --clean --paths src --distpath dist --workpath build)
          # camera.py imports PySpin lazily through importlib, so PyInstaller cannot see it.
          if [ -n "${{ matrix.lfs_include }}" ]; then
            args+=(--hidden-import PySpin --collect-all PySpin)
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            # A .app bundle (onedir) is the supported macOS GUI form.
            args+=(--name "ESPI Live" --windowed --onedir --osx-bundle-identifier io.github.alexworland.espi-live)
          else
            # Keep the console: the app mirrors its log there and Windows users start it from a shortcut or terminal.
            args+=(--name espi-live --console --onefile)
          fi
          python -m PyInstaller "${args[@]}" src/espi_live/__main__.py

      # --help exercises the launcher; --check also imports the Qt front end, the
      # engine, OpenCV, NumPy and PySpin (when bundled) without opening a window,
      # so it catches a binary that is missing bundled modules or shared libraries.
      - name: Smoke test the binary
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) exe=dist/espi-live.exe ;;
            macOS)   exe="dist/ESPI Live.app/Contents/MacOS/ESPI Live" ;;
            *)       exe=dist/espi-live ;;
          esac
          "$exe" --help
          "$exe" --version
          "$exe" --check

      # Each archive holds exactly one entry (the executable or the .app),
      # which is what the updater expects to unpack.
      - name: Package
        shell: bash
        run: |
          mkdir release
          case "$RUNNER_OS" in
            Windows) (cd dist && 7z a -tzip "../release/${{ matrix.asset }}" espi-live.exe) ;;
            macOS)   ditto -c -k --keepParent "dist/ESPI Live.app" "release/${{ matrix.asset }}" ;;
            *)       tar czf "release/${{ matrix.asset }}" -C dist espi-live ;;
          esac
          ls -lh release

      - uses: actions/upload-artifact@v4
        with:
          name: espi-live-${{ matrix.name }}
          path: release/*
          compression-level: 0 # already compressed
          if-no-files-found: error

  publish:
    name: Update "latest" release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/delete the release and its tag
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: espi-live-*
          merge-multiple: true

      # The updater reads this to decide whether to update and to verify the download.
      - name: Write build-info.json
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SHA: ${{ env.BUILD_REF }}
        run: |
          python3 - <<'EOF'
          import hashlib, json, os
          sums = {}
          for name in sorted(os.listdir("release")):
              with open(os.path.join("release", name), "rb") as handle:
                  sums[name] = hashlib.sha256(handle.read()).hexdigest()
          info = {"build": int(os.environ["BUILD_NUMBER"]), "commit": os.environ["SHA"],
                  "sha256": sums}
          with open("release/build-info.json", "w") as out:
              json.dump(info, out, indent=2)
          print(json.dumps(info, indent=2))
          EOF

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ env.BUILD_REF }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            source="Merged PR #$PR_NUMBER"
          else
            source="Manual run"
          fi
          cat > notes.md <<EOF
          $source, commit \`${SHA:0:7}\`. Build log: $RUN_URL

          - **Windows** (\`espi-live-windows-x64.zip\`) and **Linux** (\`espi-live-linux-x64.tar.gz\`) include PySpin, so they can open a real camera. Run \`espi-live --demo\` for synthetic video without one.
          - **macOS** (\`espi-live-macos-arm64.zip\`) is demo-only: there is no macOS PySpin wheel. The app is unsigned; after unzipping run \`xattr -cr "ESPI Live.app"\` or right-click > Open.
          - Installed copies update themselves from this release (Help > Check for updates, or \`espi-live --update\`).
          - Output (\`output/logs\`, \`output/frames\`, \`output/recordings\`) is written next to the executable (next to the .app on macOS).
          EOF
          # Delete and recreate so the tag follows the newest commit.
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest release/* \
            --target "$SHA" \
            --prerelease \
            --title "Latest build" \
            --notes-file notes.md
