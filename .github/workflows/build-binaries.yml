name: Release

# Builds self-contained PyInstaller binaries for Windows, Linux and macOS and
# attaches them to a GitHub release. It runs in one of three ways:
#
# 1. Every merge (push) into main (the normal way): the "version" job rewrites
#    the draft release with release-drafter, which proposes the next version
#    tag from the merged pull requests' labels, and the release is created
#    with that tag once the tests and builds pass. Its notes are GitHub's
#    generated notes (pull requests merged since the previous release, grouped
#    by .github/release.yml). A merge that lands while a release is building
#    waits for it; when several wait, GitHub keeps only the newest run, whose
#    release then covers all of them.
#
# 2. Publishing the draft release by hand (Releases > the draft > Edit >
#    Publish release) creates the tag on main and starts this workflow. Tick
#    "Set as a pre-release" when publishing to keep it from installed copies.
#    The "hold" job turns the release back into a draft at once, so nobody
#    sees a release without binaries (the updater would find no
#    build-info.json); the "publish" job uploads the archives and publishes it
#    again. If the tests or a build fail, the release stays a draft: delete its
#    tag (git push origin --delete vX.Y.Z), fix the problem and publish again.
#
# 3. By hand (Actions > Release > Run workflow), for a test build of any
#    branch ("Use workflow from"). Untick "Publish" to only test and build:
#    the archives stay on the run's page as artifacts and nothing is released.
#    Otherwise this creates the release like a merge does, tagged with the
#    "version" input, or else the version the draft release proposes, or else
#    the next patch version (see the "version" job), with any typed notes above
#    the generated ones. Runs from branches other than main, and the
#    "Pre-release" checkbox, make a pre-release tagged vX.Y.Z-pre.N, which
#    leaves vX.Y.Z for the real release.
#
# Every way, N is this workflow's run number, which build-info.json records and
# the updater uses to order builds, so the tag name does not matter to it.
# Installed copies update only to the newest full release; a pre-release is for
# testing and is never offered to them.
#
# The test job runs first; if a test fails or line coverage is below 100%,
# nothing is built or released.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. v1.2.0 (optional: default is the draft release's version, or the next patch)"
        type: string
        required: false
        default: ""
      notes:
        description: "Notes to put above the generated release notes (optional)"
        type: string
        required: false
        default: ""
      prerelease:
        description: "Pre-release: publish for testing, don't offer it to installed copies"
        type: boolean
        default: false
      publish:
        description: "Publish a release (untick to only test and build; the archives stay on the run's page)"
        type: boolean
        default: true

permissions:
  contents: read

# One release at a time, so build numbers and releases stay in order, and each
# run's "version" job sees the release before it.
concurrency:
  group: build-release
  cancel-in-progress: false

env:
  BUILD_REF: ${{ github.sha }}

jobs:
  # Only for a published release. GitHub's "latest" release is what installed
  # copies update from, and it must always carry build-info.json, so the release
  # goes back to a draft until the "publish" job has uploaded the archives.
  # Publishing it again with the workflow's own token does not start another
  # run (GITHUB_TOKEN events never trigger workflows).
  hold:
    name: Hold release as a draft
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write # edit the release
    steps:
      - name: Turn the release back into a draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release edit "$RELEASE_TAG" --draft

  # Picks the release tag first, so a bad "version" input fails before the
  # builds. A published release already has its tag. A merge or a hand-started
  # run uses the "version" input, else the version release-drafter's draft
  # proposes (from the merged pull requests' labels), else the next patch after
  # the newest vX.Y.Z release; versions whose tag already exists are skipped. A
  # pre-release gets "-pre.N" (N = run number) on that version.
  version:
    name: Choose the version tag
    runs-on: ubuntu-latest
    permissions:
      contents: write # update the draft; drafts are visible only with write access
      pull-requests: read # the drafter reads the merged pull requests' labels
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      prerelease: ${{ steps.pick.outputs.prerelease }}
    steps:
      # After a merge, rewrite the draft first so the version it proposes counts
      # the pull request just merged. This step, not a run of
      # release-drafter.yml, does it so the two cannot race; runs of this
      # workflow never overlap, so the drafter always sees the previous release.
      - name: Update the draft release
        if: github.event_name == 'push'
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          config-name: release-drafter.yml

      - name: Choose the tag
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BUILD_NUMBER: ${{ github.run_number }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
          PRERELEASE: ${{ inputs.prerelease }}
          VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$EVENT" = "release" ]; then
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "prerelease=$RELEASE_PRERELEASE" >> "$GITHUB_OUTPUT"
            echo "Release $RELEASE_TAG"
            exit 0
          fi
          prerelease=false
          if [ "$PRERELEASE" = "true" ] || [ "$IS_MAIN" != "true" ]; then prerelease=true; fi

          plain='^v[0-9]+\.[0-9]+\.[0-9]+$'
          tag_exists() { gh api "repos/$GH_REPO/git/ref/tags/$1" --silent 2>/dev/null; }
          next_patch() { local ma mi pa; IFS=. read -r ma mi pa <<< "${1#v}"; echo "v$ma.$mi.$((pa + 1))"; }
          releases() { gh api "repos/$GH_REPO/releases" --paginate --jq ".[] | select($1) | .tag_name"; }

          if [ -n "$VERSION" ]; then
            if [ "$prerelease" = "true" ]; then pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; else pattern="$plain"; fi
            if ! [[ "$VERSION" =~ $pattern ]]; then
              echo "::error::Version must look like v1.2.3 (a pre-release may add a suffix such as -pre.1), got '$VERSION'"
              exit 1
            fi
            tag="$VERSION"
          else
            version=$(releases '.draft' | grep -E "$plain" | sort -V | tail -n 1 || true)
            if [ -z "$version" ]; then
              last=$(releases '(.draft or .prerelease) | not' | grep -E "$plain" | sort -V | tail -n 1 || true)
              version=$(next_patch "${last:-v0.0.0}")
            fi
            while tag_exists "$version"; do version=$(next_patch "$version"); done
            tag="$version"
            if [ "$prerelease" = "true" ]; then tag="$version-pre.$BUILD_NUMBER"; fi
          fi
          if tag_exists "$tag"; then
            echo "::error::Tag $tag already exists; pick another version"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Release $tag (pre-release: $prerelease)"

  # Gate for the whole release: no binary is built or published unless the
  # camera-free suite passes and covers every line of src/espi_live/
  # (.coveragerc sets fail_under = 100, so `coverage report` exits non-zero
  # below that). The SDK is not needed: the tests use a fake PySpin.
  test:
    name: Tests and 100% coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}

      # Cache pip's downloads (PySide6 and OpenCV are large) between runs.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Linux system packages
        run: |
          # The same runtime libraries as the build job (Qt runs offscreen).
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 \
            libxkbcommon-x11-0 libfontconfig1 libdbus-1-3

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt coverage==7.17.0

      - name: Run tests with coverage
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: python -m coverage run -m unittest discover -s tests

      - name: Require 100% line coverage
        run: python -m coverage report

  build:
    name: Build ${{ matrix.name }}
    needs: [test, version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows matches the camera PC: Python 3.10 + the SDK 4.2 PySpin wheel.
          # numpy is unpinned because requirements.txt pins versions that need Python >= 3.11.
          - name: windows-x64
            os: windows-latest
            python: "3.10"
            pip_deps: numpy opencv-python PySide6 cv2_enumerate_cameras==1.4.0 certifi pyinstaller
            asset: espi-live-windows-x64.zip
            sdk_files: flir-spinnaker-4.2/python-wheel/spinnaker_python-4.2.0.88-cp310-cp310-win_amd64.whl
          # Linux: ubuntu-24.04 is "noble", the distro the Spinnaker 4.4 packages target.
          - name: linux-x64
            os: ubuntu-24.04
            python: "3.12"
            pip_deps: -r requirements.txt certifi pyinstaller
            asset: espi-live-linux-x64.tar.gz
            sdk_files: spinnaker-4.4/spinnaker_python-4.4.0.246-cp312-cp312-linux_x86_64.tar.gz,spinnaker-4.4/spinnaker-4.4.0.246-noble-amd64-pkg.tar.gz
          # macOS has no PySpin wheel, so this build runs --demo only.
          - name: macos-arm64
            os: macos-latest
            python: "3.12"
            pip_deps: -r requirements.txt certifi pyinstaller
            asset: espi-live-macos-arm64.zip
            sdk_files: ""

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}

      # The FLIR Spinnaker SDK is not in this public repository: it lives in the
      # private AlexWorland/espi-live-sdk, checked out into third_party/ (where
      # the paths below and the scripts expect it) with a read-only deploy key,
      # the SDK_DEPLOY_KEY secret. Without that secret only the macOS (demo)
      # build works.
      - name: Check out the FLIR SDK
        if: matrix.sdk_files != ''
        uses: actions/checkout@v4
        with:
          repository: AlexWorland/espi-live-sdk
          ssh-key: ${{ secrets.SDK_DEPLOY_KEY }}
          path: third_party
          lfs: false # fetch only the SDK files this platform needs, below

      # Git LFS bandwidth is metered, so cache the LFS objects keyed by their
      # content hashes: unchanged SDK files are never re-downloaded.
      - name: Compute LFS cache key
        if: matrix.sdk_files != ''
        id: lfs
        shell: bash
        working-directory: third_party
        env:
          SDK_FILES: ${{ matrix.sdk_files }}
        run: |
          key=$(git lfs ls-files --long --include="$SDK_FILES" | awk '{print $1}' | sort | sha256sum | cut -c1-16)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore LFS cache
        if: matrix.sdk_files != ''
        uses: actions/cache@v4
        with:
          path: third_party/.git/lfs
          key: lfs-${{ matrix.name }}-${{ steps.lfs.outputs.key }}

      - name: Fetch SDK files (Git LFS)
        if: matrix.sdk_files != ''
        shell: bash
        working-directory: third_party
        env:
          SDK_FILES: ${{ matrix.sdk_files }}
        run: git lfs pull --include="$SDK_FILES"

      # Cache pip's downloads between runs. The key also covers the OS and
      # Python version; Windows installs unpinned packages, so a new release
      # of one is downloaded once and then cached too.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # libgl1: OpenCV; libegl1/libxkbcommon*/libfontconfig1/libdbus-1-3: Qt (PySide6) runtime;
          # libav*/libswscale7: FFmpeg, which libSpinVideo links against but its package does not declare.
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 \
            libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libavcodec60 libavformat60 libavutil58 libswscale7
          # Spinnaker runtime libraries that PySpin links against (_PySpin needs
          # libSpinUpdate from spinupdate too); apt resolves their dependencies.
          mkdir -p "$RUNNER_TEMP/spinnaker"
          tar xzf third_party/spinnaker-4.4/spinnaker-4.4.0.246-noble-amd64-pkg.tar.gz \
            -C "$RUNNER_TEMP/spinnaker" --strip-components=1
          cd "$RUNNER_TEMP/spinnaker"
          # libgentl's preinst shows the FLIR EULA through debconf and exits 2 when it
          # can't (no terminal here); a preseeded acceptance makes it skip the dialog.
          echo "libspinnaker libspinnaker/accepted-flir-eula boolean true" | sudo debconf-set-selections
          # It then asks for analytics consent for the installing user (logname, else
          # $SUDO_USER) under set -e, and db_input exits 30 when nothing can be shown;
          # the answer can't be preseeded because the script resets it first. Without
          # SUDO_USER (logname finds no user here) libgentl skips the question and
          # libspinnaker's postinst skips its analytics ping.
          sudo env -u SUDO_USER DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ./libgentl_*.deb ./libspinnaker_*.deb ./libspinvideo_*.deb \
            ./libspinnaker-c_*.deb ./libspinvideo-c_*.deb ./spinupdate_*.deb
          sudo ldconfig

      - name: Install Python dependencies
        shell: bash
        run: python -m pip install --upgrade pip && python -m pip install ${{ matrix.pip_deps }}

      - name: Install PySpin (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: python -m pip install third_party/flir-spinnaker-4.2/python-wheel/spinnaker_python-4.2.0.88-cp310-cp310-win_amd64.whl

      - name: Install PySpin (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pyspin"
          tar xzf third_party/spinnaker-4.4/spinnaker_python-4.4.0.246-cp312-cp312-linux_x86_64.tar.gz \
            -C "$RUNNER_TEMP/pyspin" --wildcards '*.whl'
          python -m pip install "$RUNNER_TEMP"/pyspin/*.whl

      # Fail here, not in the field, if the SDK did not install correctly.
      - name: Check PySpin imports
        if: matrix.sdk_files != ''
        shell: bash
        run: python -c "import PySpin; print('PySpin loaded from', PySpin.__file__)"

      # Build facts the updater compares against build-info.json in the release.
      # The run number only increases, so it orders builds. The repository is
      # public, so installed copies read releases anonymously; UPDATE_TOKEN is
      # optional (an empty secret is fine) and only raises the API rate limit.
      # FEEDBACK_TOKEN is a separate fine-grained token with only Issues: read &
      # write. The built binary must contain it: Request feature, camera
      # reports and --send-changes file issues with it. Feature requests have
      # no browser fallback. The step fails when the secret is missing.
      # COMMITTED_AT is the commit time the error reporter compares against
      # an issue's closed_at to tell a regression from a fixed bug.
      - name: Write build info
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          COMMIT: ${{ env.BUILD_REF }}
          REPO: ${{ github.repository }}
          ASSET: ${{ matrix.asset }}
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
          FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_TOKEN }}
        run: |
          COMMITTED_AT="$(git show -s --format=%cI "$COMMIT")"
          export COMMITTED_AT
          python - <<'EOF'
          import os
          values = {"BUILD": int(os.environ["BUILD_NUMBER"])}
          for name in ("COMMIT", "COMMITTED_AT", "REPO", "ASSET"):
              values[name] = os.environ[name]
          values["TOKEN"] = os.environ.get("UPDATE_TOKEN", "")
          values["FEEDBACK_TOKEN"] = os.environ.get("FEEDBACK_TOKEN", "").strip()
          if not values["FEEDBACK_TOKEN"]:
              raise SystemExit(
                  "FEEDBACK_TOKEN secret is empty; the built binary must "
                  "include it so the app can file issues")
          with open("src/espi_live/_build_info.py", "w", encoding="utf-8") as out:
              out.write('"""Generated by CI; read by updater.py, feedback.py and '
                        'error_reports.py."""\n')
              for name, value in values.items():
                  out.write(f"{name} = {value!r}\n")
          print("Build", values["BUILD"], values["ASSET"],
                "with update token" if values["TOKEN"] else "WITHOUT update token",
                "and with feedback token",
                f"committed {values['COMMITTED_AT']}")
          EOF

      - name: Build with PyInstaller
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          args=(--noconfirm --clean --paths src --distpath dist --workpath build)
          # The Help menu opens the bundled HTML user guide; ship it as data.
          if [ "$RUNNER_OS" = "Windows" ]; then
            args+=(--add-data "src/espi_live/user_guide.html;espi_live")
          else
            args+=(--add-data "src/espi_live/user_guide.html:espi_live")
          fi
          # camera.py imports PySpin lazily through importlib, so PyInstaller cannot see it.
          if [ -n "${{ matrix.sdk_files }}" ]; then
            args+=(--hidden-import PySpin --collect-all PySpin)
          fi
          # Lists video devices (the analog-camera capture adapter); not used on macOS.
          if [ "$RUNNER_OS" != "macOS" ]; then
            args+=(--hidden-import cv2_enumerate_cameras --collect-all cv2_enumerate_cameras)
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            # A .app bundle (onedir) is the supported macOS GUI form.
            args+=(--name "ESPI Live" --windowed --onedir --osx-bundle-identifier io.github.alexworland.espi-live)
          else
            # A folder (onedir) starts at once, where a single self-extracting
            # file unpacks everything to a temporary folder on every start. Each
            # build keeps its libraries in its own _internal-N (N = build number)
            # beside the executable: Windows cannot overwrite or delete the DLLs a
            # running copy has loaded, so an update moves the new folder in beside
            # the old one and swaps only the executable (see updater.py).
            # Keep the console: the app mirrors its log there and Windows users start it from a shortcut or terminal.
            args+=(--name espi-live --console --onedir --contents-directory "_internal-$BUILD_NUMBER")
          fi
          python -m PyInstaller "${args[@]}" src/espi_live/__main__.py

      # --help exercises the launcher; --check also imports the Qt front end, the
      # engine, OpenCV, NumPy and PySpin (when bundled) without opening a window,
      # so it catches a binary that is missing bundled modules or shared libraries.
      # The program folder must hold only the executable and _internal-N, the
      # layout the updater accepts (updater.move_in_library).
      - name: Smoke test the binary
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          case "$RUNNER_OS" in
            Windows) exe=dist/espi-live/espi-live.exe ;;
            macOS)   exe="dist/ESPI Live.app/Contents/MacOS/ESPI Live" ;;
            *)       exe=dist/espi-live/espi-live ;;
          esac
          "$exe" --help
          "$exe" --version
          # The token is inside the frozen program (not an env var or a sidecar
          # file). --check names whether it is present and never prints it.
          unset ESPI_FEEDBACK_TOKEN
          check_out=$("$exe" --check)
          printf '%s\n' "$check_out"
          case "$check_out" in
            *"feedback token: present"*) ;;
            *) echo "::error::the binary has no feedback token"; exit 1 ;;
          esac
          if [ "$RUNNER_OS" != "macOS" ]; then
            shopt -s dotglob
            entries=(dist/espi-live/*)
            if [ "${#entries[@]}" -ne 2 ] || [ ! -f "$exe" ] || [ ! -d "dist/espi-live/_internal-$BUILD_NUMBER" ]; then
              echo "::error::dist/espi-live must hold only $(basename "$exe") and _internal-$BUILD_NUMBER, not: ${entries[*]##*/}"
              exit 1
            fi
          fi

      # Each archive holds one entry, which the updater unpacks: the espi-live
      # program folder (Windows, Linux) or the .app bundle (macOS).
      - name: Package
        shell: bash
        run: |
          mkdir release
          case "$RUNNER_OS" in
            Windows) (cd dist && 7z a -tzip "../release/${{ matrix.asset }}" espi-live) ;;
            macOS)   ditto -c -k --keepParent "dist/ESPI Live.app" "release/${{ matrix.asset }}" ;;
            *)       tar czf "release/${{ matrix.asset }}" -C dist espi-live ;;
          esac
          ls -lh release

      - uses: actions/upload-artifact@v4
        with:
          name: espi-live-${{ matrix.name }}
          path: release/*
          compression-level: 0 # already compressed
          if-no-files-found: error

  publish:
    name: Publish release
    # "hold" is skipped unless a draft was published by hand, which would
    # otherwise skip this job too; it only has to be finished so it cannot undo
    # the publishing. A hand-started run with "Publish" unticked stops before it.
    needs: [version, build, hold]
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.publish) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create or edit the release (and its tag)
      actions: write # re-run release-drafter after a hand-started release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: espi-live-*
          merge-multiple: true

      # The updater reads this to decide whether to update and to verify the
      # download. The archives' sums go under "archives". The single-file builds
      # (build 6 and earlier) read "sha256" instead, which is left out on
      # purpose: their updater would put the new program folder where their
      # executable was, so they must find no archive (they report "build N has
      # no <archive>" and are downloaded once by hand).
      - name: Write build-info.json
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SHA: ${{ env.BUILD_REF }}
        run: |
          python3 - <<'EOF'
          import hashlib, json, os
          sums = {}
          for name in sorted(os.listdir("release")):
              with open(os.path.join("release", name), "rb") as handle:
                  sums[name] = hashlib.sha256(handle.read()).hexdigest()
          info = {"build": int(os.environ["BUILD_NUMBER"]), "commit": os.environ["SHA"],
                  "archives": sums}
          with open("release/build-info.json", "w") as out:
              json.dump(info, out, indent=2)
          print(json.dumps(info, indent=2))
          EOF

      # A published draft already exists (named, tagged and described by
      # release-drafter): attach the archives, append the build facts to its
      # notes and publish it. A merge or a hand-started run creates the release
      # itself, tagged by the "version" job, with GitHub's generated notes
      # appended to any typed notes and the build facts; after a full release
      # it re-runs release-drafter so the draft proposes the version after this
      # one.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ env.BUILD_REF }}
          BUILD_NUMBER: ${{ github.run_number }}
          BRANCH: ${{ github.ref_name }}
          USER_NOTES: ${{ inputs.notes }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$EVENT" = "release" ]; then
            source="tag \`$TAG\`"
            intro="$RELEASE_BODY"
          else
            source="\`$BRANCH\`"
            intro="$USER_NOTES"
          fi
          if [ "$PRERELEASE" = "true" ]; then
            kind="Pre-release (not offered to installed copies)"
          else
            kind="Release"
          fi
          {
            if [ -n "$intro" ]; then printf '%s\n\n' "$intro"; fi
            cat <<EOF
          $kind from $source, commit \`${SHA:0:7}\`, build $BUILD_NUMBER. Build log: $RUN_URL

          - **Windows** (\`espi-live-windows-x64.zip\`) and **Linux** (\`espi-live-linux-x64.tar.gz\`) include PySpin, so they can open a real camera. Each unpacks to an \`espi-live\` folder: run \`espi-live.exe\` (\`espi-live\` on Linux) inside it, and keep the folder together, since the program loads its libraries from the \`_internal-$BUILD_NUMBER\` folder beside it. Add \`--demo\` for synthetic video without a camera.
          - **macOS** (\`espi-live-macos-arm64.zip\`) is demo-only: there is no macOS PySpin wheel. The app is unsigned; after unzipping run \`xattr -cr "ESPI Live.app"\` or right-click > Open.
          - Installed copies update themselves to the newest full release (Help > Check for updates, or \`espi-live --update\`). Copies that are a single \`espi-live.exe\` file (build 6 and earlier) cannot update to the folder layout: download this release once by hand.
          - Output (\`output/logs\`, \`output/frames\`, \`output/recordings\`) is written in the \`espi-live\` folder, next to the executable (next to the .app on macOS).
          EOF
          } > notes.md

          if [ "$EVENT" = "release" ]; then
            gh release upload "$TAG" release/* --clobber
            flags=(--draft=false --notes-file notes.md --prerelease="$PRERELEASE")
            if [ "$PRERELEASE" != "true" ]; then flags+=(--latest); fi
            gh release edit "$TAG" "${flags[@]}"
          else
            flags=()
            if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
            gh release create "$TAG" release/* \
              --target "$SHA" \
              --title "$TAG" \
              --notes-file notes.md \
              --generate-notes \
              "${flags[@]}"
            # A run started with the workflow's token is allowed for workflow_dispatch.
            if [ "$PRERELEASE" != "true" ]; then gh workflow run release-drafter.yml --ref main; fi
          fi
