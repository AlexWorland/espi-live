name: Update end-to-end tests

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  update:
    name: Update on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.10"
            dependencies: numpy opencv-python PySide6 cv2_enumerate_cameras==1.4.0
          - os: ubuntu-24.04
            python: "3.12"
            dependencies: -r requirements.txt
          - os: macos-latest
            python: "3.12"
            dependencies: -r requirements.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 \
            libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
      - name: Install dependencies
        run: python -m pip install ${{ matrix.dependencies }} certifi pyinstaller
      - name: Test update integration
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p test_update_integration.py -v
      - name: Test native A to B updates
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
          ESPI_TEST_ARTIFACTS: update-test-results
        run: python -m unittest discover -s tests/e2e -v
      - name: Keep process evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-tests-${{ matrix.os }}
          path: update-test-results/
          if-no-files-found: ignore
