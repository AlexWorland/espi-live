# Categories for GitHub's generated release notes: the "Generate release notes"
# button on the Releases page and the releases build-binaries.yml creates after
# each merge or when started by hand (gh release create --generate-notes).
# Releases published from the draft get their notes from release-drafter
# instead (.github/release-drafter.yml); keep the labels here in step with it.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Features
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - "*"
